name: ci
# Anti-drift: the committed surfaces (llms.txt, README.md, index.html package
# links) must match what generate.lex produces from catalog.lex. The package
# list itself is two live links (GitHub search, the hub registry), so there
# is no separate "does the list match reality" check to run anymore.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      LEX_VERSION: v0.10.7
    steps:
      - uses: actions/checkout@v4
      - name: Install lex toolchain
        run: |
          set -euo pipefail
          tgt=x86_64-unknown-linux-gnu
          curl -fsSL "https://github.com/alpibrusl/lex-lang/releases/download/${LEX_VERSION}/lex-${LEX_VERSION}-${tgt}.tar.gz" -o /tmp/lex.tgz
          tar -xzf /tmp/lex.tgz -C /tmp
          sudo mv "/tmp/lex-${LEX_VERSION}-${tgt}/lex" /usr/local/bin/lex
          lex version
      - name: Surfaces in sync with catalog.lex
        run: make verify
